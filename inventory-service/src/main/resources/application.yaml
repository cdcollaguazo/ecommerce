spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  mvc:
    servlet:
      path: /api
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:mysql://localhost:3306/inventory}
    username: ${INVENTORY_DB_USER:root}
    password: ${INVENTORY_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082
