spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  mvc:
    servlet:
      path: /api
  datasource:
    url: jdbc:mysql://localhost:3306/inventory
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080
