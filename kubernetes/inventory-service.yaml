apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: ecommerce-inventory-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: inventory-service
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: inventory-service
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-service
                  key: DB_PASSWORD
            - name: RABBIT_MQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: common
                  key: RABBIT_MQ_HOST
            - name: RABBIT_MQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: common
                  key: RABBIT_MQ_PORT
            - name: RABBIT_MQ_USER
              valueFrom:
                secretKeyRef:
                  name: common
                  key: RABBIT_MQ_USER
            - name: RABBIT_MQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: common
                  key: RABBIT_MQ_PASSWORD
            - name: OTLP_TRACING_URL
              value: "http://lgtm:4318/v1/traces"
            - name: OTLP_LOGS_URL
              value: "http://lgtm:4318/v1/logs"
            - name: OTLP_METRICS_URL
              value: "http://lgtm:4318/v1/metrics"
