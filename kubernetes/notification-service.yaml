apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ecommerce-notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: notification-service
                  key: MAIL_HOST
            - name: MAIL_SSL_PORT
              valueFrom:
                configMapKeyRef:
                  name: notification-service
                  key: MAIL_SSL_PORT
            - name: MAIL_USER
              valueFrom:
                secretKeyRef:
                  name: notification-service
                  key: MAIL_USER
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-service
                  key: MAIL_PASSWORD
            - name: RABBIT_MQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: common
                  key: RABBIT_MQ_HOST
            - name: RABBIT_MQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: common
                  key: RABBIT_MQ_PORT
            - name: RABBIT_MQ_USER
              valueFrom:
                secretKeyRef:
                  name: common
                  key: RABBIT_MQ_USER
            - name: RABBIT_MQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: common
                  key: RABBIT_MQ_PASSWORD
