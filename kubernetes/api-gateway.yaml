apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ecommerce-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          env:
            - name: JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: common
                  key: JWT_ISSUER_URI
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8081"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8082"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8084"
            - name: OTLP_TRACING_URL
              value: "http://lgtm:4318/v1/traces"
            - name: OTLP_LOGS_URL
              value: "http://lgtm:4318/v1/logs"
            - name: OTLP_METRICS_URL
              value: "http://lgtm:4318/v1/metrics"
