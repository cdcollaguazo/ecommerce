services:
  product-db:
    image: mongo:7.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - product-data:/data/db
    ports:
      - "27017:27017"

  inventory-db:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory
    volumes:
      - inventory-data:/var/lib/mysql

  order-db:
    image: postgres:18.0
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: order
    volumes:
      - order-data:/var/lib/postgresql/18/docker
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dev
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: dev
      KC_DB_PASSWORD: dev
    command: "start-dev"
    ports:
      - "9090:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:18.0
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD", "pg_isready"]
      start_period: 10s
    ports:
      - "5433:5432"

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  mail:
    image: maildev/maildev
    ports:
      - "1025:1025"
      - "1080:1080"

#  product-service:
#    build: ./product-service
#    ports:
#      - "8080:8080"
#    environment:
#      SPRING_MONGODB_URI: mongodb://root:password@mongodb:27017/product-db?authSource=admin
#    depends_on:
#      - mongodb

volumes:
  product-data:
    driver: local
  inventory-data:
    driver: local
  order-data:
    driver: local
  keycloak-data:
    driver: local
  rabbitmq-data:
    driver: local
