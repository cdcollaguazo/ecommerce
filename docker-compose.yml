#    ports:
#      - "8080:8080"
#    environment:
#      SPRING_MONGODB_URI: mongodb://root:password@mongodb:27017/product-db?authSource=admin
#    depends_on:
#      - mongodb

volumes:
  product-data:
    driver: local
  inventory-data:
    driver: local
  order-data:
    driver: local
