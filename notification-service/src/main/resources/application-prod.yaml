spring:
  threads:
    virtual:
      enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_SSL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000ms
          max-retries: 3
          max-interval: 10000ms
          multiplier: 2.0
